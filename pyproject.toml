[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "leanfhir"
version = "0.1.0"
description = "Lean FHIR R4 demographic/admin server (PoC/MVP grade)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Koray Atalag" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "sqlalchemy==2.1.9",
    "fhir.resources==8.3.0",
    "pydantic-settings==2.16.3",
    "psycopg[binary]==3.3.9",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "httpx==0.28.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
